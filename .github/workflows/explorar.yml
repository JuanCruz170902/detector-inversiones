name: Explorar fuentes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/explorar.py"]

permissions:
  contents: write

concurrency:
  group: corrida-diaria
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/explorar.py
      - run: |
          git config user.name "detector-bot"
          git config user.email "detector-bot@users.noreply.github.com"
          git add docs/data/explorar
          git diff --cached --quiet || git commit -m "Exploración de fuentes"
          git pull --rebase --autostash || true
          git push
