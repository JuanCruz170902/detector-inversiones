name: Corrida diaria

on:
  schedule:
    # 17:45 hora Argentina (20:45 UTC), lunes a viernes, después del cierre de BYMA
    - cron: "45 20 * * 1-5"
    # respaldo: los cron de GitHub pueden demorarse horas; la valuación es idempotente por rueda
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "config/**", "tests/**", ".github/workflows/diario.yml"]

permissions:
  contents: write

concurrency:
  group: corrida-diaria
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests offline
        run: python -m pytest -q tests
      - name: Corrida
        run: python -m src.main
      - name: Prueba semanal (valuación al cierre)
        if: github.event_name == 'schedule'
        run: python -m src.prueba valuar || true
      - name: Guardar resultados
        run: |
          git config user.name "detector-bot"
          git config user.email "detector-bot@users.noreply.github.com"
          git add docs/data reporte.md
          git diff --cached --quiet || git commit -m "Datos $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
