# Reglas por perfil de riesgo.
# Todos los porcentajes son sobre el monto a invertir en el mes.
# Editá este archivo para cambiar el comportamiento del detector: el código no tiene reglas "escondidas".

monto_default: 200000        # ARS a invertir por mes si no se indica otro
horizonte_meses: [1, 6]      # horizonte corto: se priorizan instrumentos que vencen en este rango
dias_sin_balance: 7          # no comprar acciones/CEDEARs que presentan resultados en los próximos N días hábiles
filtro_calidad:
  excluir_perdidas: true     # no proponer empresas con resultado neto negativo en los últimos 12 meses (SEC)
hard_dollar_duration_max: 3  # soberanos en USD: solo duration corta (más sensibles al riesgo país los largos)

broker:
  nombre: Cocos (plan base)
  comision_acciones: 0.0045  # acciones y CEDEARs, por operación
  comision_bonos: 0.0015     # bonos y letras, por operación
  derechos_mercado: 0.0008   # BYMA, aprox.
  iva_sobre_comision: 0.21
  ticket_minimo: 20000       # no abrir posiciones más chicas que esto (ARS)

perfiles:
  conservador:
    descripcion: Preservar poder de compra en pesos con riesgo bajo. Sin acciones.
    max_posiciones: 4
    max_peso_posicion: 0.40   # renta fija soberana: se tolera más concentración
    buckets:
      cer: 0.35              # bonos ajustados por inflación
      tasa_fija: 0.30        # LECAP / BONCAP
      dollar_linked: 0.20    # cobertura contra devaluación oficial
      liquidez: 0.15         # caución / FCI money market (se deja en pesos)
    ajustes:
      # si la tasa real esperada es negativa, se pasa peso de tasa fija a CER (y al revés)
      rotacion_cer_tasa_fija: 0.15
      # si la brecha MEP/oficial supera este umbral, se pasa peso de liquidez a dollar linked
      brecha_alerta: 0.15
      rotacion_dl: 0.10

  moderado:
    descripcion: Mayormente renta fija, con una parte en dólares y CEDEARs de índices.
    max_posiciones: 5
    max_peso_posicion: 0.30
    buckets:
      cer: 0.20
      tasa_fija: 0.20
      hard_dollar: 0.20      # soberanos en dólares de corta duration
      cedears_etf: 0.30      # ETFs amplios vía CEDEAR (SPY, QQQ, DIA, EEM...)
      liquidez: 0.10
    filtros_renta_variable:
      solo_tendencia_alcista: true   # precio por encima de su media de 200 ruedas
      vol_max_anual: 0.35

  riesgoso:
    descripcion: Busca retorno en renta variable; acepta caídas fuertes.
    max_posiciones: 6
    max_peso_posicion: 0.25
    buckets:
      tasa_fija: 0.15
      cedears: 0.45          # CEDEARs individuales y ETFs
      acciones_arg: 0.40     # panel líder del Merval
    filtros_renta_variable:
      solo_tendencia_alcista: false
      vol_max_anual: 0.80

scoring_renta_variable:
  # v0.2: momentum de 12 meses (la versión estándar). En el backtest 2023-2026 superó a la regla
  # anterior (3m+6m ajustada por volatilidad) en CEDEARs; ver REGLAS.md §7.
  peso_ret_3m: 0
  peso_ret_6m: 0
  peso_ret_12m: 1.0
  ajustar_por_vol: false
  penalizar_rsi_mayor_a: 0       # 0 = sin penalización por sobrecompra
  penalizacion_rsi: 1.0
  volumen_min_ars: 5000000       # liquidez mínima diaria en BYMA

# Acciones argentinas: ninguna variante de momentum le ganó a una canasta diversificada en el backtest,
# así que se elige por liquidez (las más operadas del panel líder) con igual peso.
modo_por_bucket:
  acciones_arg: liquidez
